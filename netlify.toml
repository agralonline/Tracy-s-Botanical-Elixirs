[build]
  publish = "."
  functions = "functions"
  command = "echo 'No build step — static HTML/CSS/JS site.'"

[functions]
  node_bundler = "esbuild"

# The frontend calls fetch("/api/...") uniformly across both Netlify and
# Vercel (see assets/js/cart.js and admin/admin.js). On Netlify, functions
# actually live at /.netlify/functions/<name> — these rewrites let the
# rest of the codebase stay platform-agnostic.
[[redirects]]
  from = "/api/translate-and-save"
  to = "/.netlify/functions/translate-and-save"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate-category"
  to = "/.netlify/functions/translate-category"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate-announcement"
  to = "/.netlify/functions/translate-announcement"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate-blog-field"
  to = "/.netlify/functions/translate-blog-field"
  status = 200
  force = true

[[redirects]]
  from = "/api/update-order"
  to = "/.netlify/functions/update-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/track-order"
  to = "/.netlify/functions/track-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[headers]]
  # IMPORTANT: this project has no build step and no filename hashing, so
  # every JS file always has the SAME URL (e.g. /assets/js/products.js)
  # across every deploy. A long/immutable cache here means a visitor's
  # browser can keep serving a stale, pre-deploy copy of these files for
  # up to a year, ignoring every subsequent deploy — this is exactly what
  # caused a real production incident (a stale assets/js/products.js
  # missing a newer export broke the entire storefront for anyone who'd
  # visited before, with no way to recover short of a manual hard-refresh
  # / cache clear). `must-revalidate` forces the browser to check back
  # with Netlify on every load; a matching ETag still returns a fast 304
  # with no re-download, so this costs virtually nothing while
  # guaranteeing every deploy actually reaches every visitor immediately.
  # If filename-hashed asset builds are ever introduced, this can safely
  # go back to a long immutable cache.
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
