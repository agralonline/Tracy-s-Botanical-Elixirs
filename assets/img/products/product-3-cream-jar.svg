<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="p3title">
  <title id="p3title">Heavy frosted glass jar of cream with a brushed gold lid on a polished dark wood base with soft gold and cyan ambient bokeh</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="p3-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c12"/>
      <stop offset="100%" stop-color="#100a06"/>
    </linearGradient>
    <linearGradient id="p3-jar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9eef2" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#c9d2da" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8f9aa6" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="p3-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#efe6d3"/>
    </linearGradient>
    <linearGradient id="p3-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1D888"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8a7128"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#p3-bg)"/>

  <!-- bokeh -->
  <g opacity="0.55">
    <circle cx="90" cy="120" r="26" fill="#D4AF37" opacity="0.25"/>
    <circle cx="150" cy="90" r="12" fill="#34e8e0" opacity="0.3"/>
    <circle cx="500" cy="150" r="34" fill="#2be8a8" opacity="0.2"/>
    <circle cx="460" cy="230" r="14" fill="#D4AF37" opacity="0.25"/>
    <circle cx="70" cy="260" r="10" fill="#34e8e0" opacity="0.25"/>
    <circle cx="530" cy="330" r="20" fill="#D4AF37" opacity="0.18"/>
  </g>

  <!-- polished dark wood base -->
  <path d="M0 470 L600 470 L600 600 L0 600 Z" fill="url(#p3-wood)"/>
  <g opacity="0.5" stroke="#3a281a" stroke-width="1.4" fill="none">
    <path d="M0 495 Q300 505 600 495"/>
    <path d="M0 525 Q300 535 600 525"/>
    <path d="M0 555 Q300 565 600 555"/>
  </g>
  <ellipse cx="300" cy="474" rx="150" ry="14" fill="#000000" opacity="0.35"/>

  <!-- jar reflection sheen on wood -->
  <ellipse cx="300" cy="480" rx="110" ry="9" fill="#D4AF37" opacity="0.12"/>

  <!-- frosted glass jar -->
  <g>
    <rect x="205" y="270" width="190" height="200" rx="26" fill="url(#p3-jar)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="205" y="270" width="190" height="200" rx="26" fill="#ffffff" opacity="0.03"/>
    <!-- cream fill visible through frosted rim -->
    <path d="M215 280 Q300 262 385 280 L385 300 Q300 282 215 300 Z" fill="url(#p3-cream)"/>
    <!-- vertical shine -->
    <rect x="228" y="300" width="18" height="150" rx="9" fill="#ffffff" opacity="0.18"/>

    <!-- brushed gold lid -->
    <rect x="195" y="228" width="210" height="52" rx="14" fill="url(#p3-gold)"/>
    <g opacity="0.35" stroke="#5a4718" stroke-width="1">
      <line x1="205" y1="238" x2="395" y2="238"/>
      <line x1="205" y1="248" x2="395" y2="248"/>
      <line x1="205" y1="258" x2="395" y2="258"/>
      <line x1="205" y1="268" x2="395" y2="268"/>
    </g>
    <rect x="195" y="228" width="210" height="10" rx="5" fill="#F6E3A0" opacity="0.55"/>

    <!-- gold ring detail -->
    <rect x="205" y="270" width="190" height="10" fill="url(#p3-gold)" opacity="0.9"/>
  </g>

  <!-- label plaque -->
  <rect x="252" y="360" width="96" height="66" rx="4" fill="#0d1424" opacity="0.55" stroke="url(#p3-gold)" stroke-width="1"/>
  <text x="300" y="386" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#E8C766">TRACY</text>
  <line x1="270" y1="394" x2="330" y2="394" stroke="#D4AF37" stroke-width="0.6"/>
  <text x="300" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" letter-spacing="1.5" fill="#cfd6e2">ORGANIC NIGHT CREAM</text>
</svg>
