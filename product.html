<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Tracy's Botanical Elixirs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230a0f1d' stroke='%23D4AF37' stroke-width='4'/%3E%3Ctext x='50' y='63' font-size='46' text-anchor='middle' fill='%23D4AF37' font-family='Georgia,serif'%3ET%3C/text%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0f1d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy: { 950:"#050b14",900:"#0a0f1d",850:"#0d1424",800:"#111a2e",700:"#16233c" }, gold: { DEFAULT:"#D4AF37", soft:"#E8C766", dim:"#8a7128" }, cyan:{glow:"#34e8e0"}, emerald:{glow:"#2be8a8"} },
    fontFamily: { display: ["Cormorant Garamond","serif"], sans: ["Inter","Arial","sans-serif"] },
  } } };
</script>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="font-sans">

<header class="site-header sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-5 md:px-8 h-20 flex items-center justify-between gap-4">
    <a href="/index.html" class="flex items-center gap-2 shrink-0">
      <span class="heading-serif text-lg sm:text-2xl tracking-wide gold-gradient-text">Tracy's<span class="text-ink-100 font-normal"> Botanical Elixirs</span></span>
    </a>
    <nav class="hidden lg:flex items-center gap-7">
      <a href="/index.html" class="nav-link" data-i18n="nav_home">Home</a>
      <a href="/shop.html" class="nav-link" data-i18n="nav_shop">Shop</a>
      <a href="/about.html" class="nav-link" data-i18n="nav_about">Our Story</a>
      <a href="/blog.html" class="nav-link" data-i18n="nav_blog">Journal</a>
      <a href="/faq.html" class="nav-link" data-i18n="nav_faq">FAQ</a>
      <a href="/contact.html" class="nav-link" data-i18n="nav_contact">Contact</a>
    </nav>
    <div class="flex items-center gap-3 md:gap-4">
      <select id="languageSelector" class="input-glass !py-2 !px-3 text-xs hidden sm:block" aria-label="Language"></select>
      <button id="cart-toggle-btn" type="button" class="relative btn-ghost p-2" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1.4" fill="currentColor"/><circle cx="18" cy="21" r="1.4" fill="currentColor"/></svg>
        <span id="cart-count-badge" class="badge-cart-count" style="display:none;">0</span>
      </button>
      <button id="mobile-nav-toggle" type="button" class="lg:hidden btn-ghost p-2" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <nav id="mobile-nav" class="hidden lg:hidden glass-panel mx-4 mb-3 p-4 rounded-xl flex flex-col gap-3">
    <a href="/index.html" class="nav-link" data-i18n="nav_home">Home</a>
    <a href="/shop.html" class="nav-link" data-i18n="nav_shop">Shop</a>
    <a href="/about.html" class="nav-link" data-i18n="nav_about">Our Story</a>
    <a href="/blog.html" class="nav-link" data-i18n="nav_blog">Journal</a>
    <a href="/faq.html" class="nav-link" data-i18n="nav_faq">FAQ</a>
    <a href="/contact.html" class="nav-link" data-i18n="nav_contact">Contact</a>
    <select id="languageSelectorMobile" class="input-glass !py-2 !px-3 text-xs mt-2" aria-label="Language"></select>
  </nav>
</header>

<section class="max-w-7xl mx-auto px-5 md:px-8 py-14">
  <div id="product-detail"></div>
</section>

<section class="max-w-7xl mx-auto px-5 md:px-8 pb-24">
  <h2 class="heading-serif text-2xl mb-8" data-i18n="section_bestsellers">Bestsellers</h2>
  <div id="related-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</section>

<footer class="border-t border-white/5 py-12">
  <div class="max-w-7xl mx-auto px-5 md:px-8 text-center text-ink-700 text-xs">
    &copy; <span data-current-year>2026</span> Tracy's Botanical Elixirs. <span data-i18n="footer_rights">All rights reserved.</span>
  </div>
  <div class="flex flex-wrap items-center justify-center gap-2 mt-8">
    <span class="payment-badge">Visa</span>
    <span class="payment-badge">Mastercard</span>
    <span class="payment-badge">Amex</span>
    <span class="payment-badge">Apple Pay</span>
    <span class="payment-badge">Stripe</span>
  </div>
  <p class="text-center text-ink-700 text-xs mt-2">Created and designed by <span class="text-gold-soft">AgralOnline</span></p>
</footer>

<div id="cart-overlay" class="fixed inset-0 bg-black/60 z-40"></div>
<aside id="cart-drawer" class="fixed top-0 bottom-0 right-0 w-full max-w-md glass-panel z-50 flex flex-col">
  <div class="flex items-center justify-between p-5 border-b border-white/5">
    <h2 class="heading-serif text-xl" data-i18n="cart_title">Your Cart</h2>
    <button id="cart-close-btn" type="button" class="btn-ghost p-1" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="cart-drawer-body" class="flex-1 overflow-y-auto px-5"></div>
  <div id="cart-drawer-footer" class="p-5 border-t border-white/5"></div>
</aside>

<script type="module">
  import { bootstrapPage } from "/assets/js/main.js";
  import { renderProductDetail, renderProductGrid } from "/assets/js/products.js";
  import { onLocaleChange, initLanguageSelector } from "/assets/js/i18n.js";

  await bootstrapPage();
  const el = document.getElementById("languageSelectorMobile");
  if (el) initLanguageSelector(el);
  el?.addEventListener("change", (e) => {
    document.getElementById("languageSelector").value = e.target.value;
    document.getElementById("languageSelector").dispatchEvent(new Event("change"));
  });

  const slug = new URLSearchParams(window.location.search).get("slug");
  const detailEl = document.getElementById("product-detail");
  const relatedEl = document.getElementById("related-grid");

  async function refresh() {
    await renderProductDetail(detailEl, slug);
    await renderProductGrid(relatedEl, { featuredOnly: true });
  }

  await refresh();
  onLocaleChange(refresh);
</script>
</body>
</html>
